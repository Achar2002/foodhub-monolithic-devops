<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodHub</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f7f7f7;
            color: #333;
        }

        header {
            background: #e23744;
            color: white;
            padding: 25px 8%;
            text-align: center;
        }

        header h1 {
            margin-bottom: 8px;
        }

        .hero {
            background: white;
            text-align: center;
            padding: 50px 20px;
        }

        .hero h2 {
            font-size: 36px;
            margin-bottom: 15px;
        }

        .hero p {
            color: #666;
            margin-bottom: 25px;
        }

        .restaurants {
            padding: 40px 8%;
        }

        .restaurants h2 {
            margin-bottom: 25px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .card p {
            color: #666;
            margin-bottom: 10px;
        }

        .rating {
            color: green;
            font-weight: bold;
        }

        footer {
            margin-top: 40px;
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>FoodHub</h1>
    <p>Discover delicious food near you</p>
</header>

<section class="hero">
    <h2>Order Food You Love</h2>
    <p>Discover restaurants and delicious meals with FoodHub.</p>
</section>


<!-- Restaurants -->
<section class="restaurants">

    <h2>Popular Restaurants</h2>

    <div id="restaurant-list" class="cards">
        <p>Loading restaurants...</p>
    </div>

</section>


<!-- Food Menu -->
<section class="restaurants">

    <h2>Food Menu</h2>

    <div id="food-list" class="cards">
        <p>Loading food...</p>
    </div>

</section>


<!-- JavaScript -->
<script>

    // Call Restaurant API
    fetch("/restaurants")
        .then(response => response.text())
        .then(data => {

            document.getElementById("restaurant-list").innerHTML =
                "<div class='card'>" +
                "<h3>Restaurants</h3>" +
                "<p>" + data + "</p>" +
                "</div>";

        })
        .catch(error => {

            document.getElementById("restaurant-list").innerHTML =
                "<p>Unable to load restaurants.</p>";

            console.error(error);
        });


    // Call Food API
    fetch("/food")
        .then(response => response.text())
        .then(data => {

            document.getElementById("food-list").innerHTML =
                "<div class='card'>" +
                "<h3>Today's Menu</h3>" +
                "<p>" + data + "</p>" +
                "</div>";

        })
        .catch(error => {

            document.getElementById("food-list").innerHTML =
                "<p>Unable to load food.</p>";

            console.error(error);
        });

</script>


<footer>
    <p>© 2026 FoodHub | DevOps Practice Project</p>
</footer>

</body>
</html>
